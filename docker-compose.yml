# CVMaker as a hosted site: web + workers + Postgres. Put a TLS proxy (Caddy, Traefik, nginx) in front of "web".
#   cp .env.example .env   # then fill in the server section
#   docker compose up -d
services:
  web:
    build: .
    env_file: .env
    environment:
      CVMAKER_MODE: server
      DATABASE_URL: postgresql://cvmaker:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cvmaker
    volumes: [data:/data]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [db]
    restart: unless-stopped
    cap_drop: [ALL]
    # Also recommended on a standard Docker host (it fails with Snap-packaged Docker on Ubuntu):
    # security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
  worker:
    build: .
    env_file: .env
    environment:
      CVMAKER_MODE: server
      DATABASE_URL: postgresql://cvmaker:${POSTGRES_PASSWORD}@db:5432/cvmaker
    volumes: [data:/data]
    command: ["python", "-m", "cvmaker.worker", "4", "--scheduler"]
    depends_on: [db]
    restart: unless-stopped
    cap_drop: [ALL]
    # Also recommended on a standard Docker host (it fails with Snap-packaged Docker on Ubuntu):
    # security_opt: ["no-new-privileges:true"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvmaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cvmaker
    volumes: [pg:/var/lib/postgresql/data]
    restart: unless-stopped
volumes:
  data:
  pg:
