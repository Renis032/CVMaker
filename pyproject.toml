[project]
name = "cvmaker"
version = "0.1.0"
description = "Job search across job boards and company career pages, with Claude-tailored CVs"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "openpyxl>=3.1.5",
    "cryptography>=50.0.2",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
server = [
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
]
desktop = [
    "pywebview>=5.0",
]

[project.scripts]
cvmaker = "cvmaker.desktop:main"
cvmaker-worker = "cvmaker.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Errors, pyflakes, bugbear, bare/blind-except hygiene. Style (line length, formatting) is left alone.
select = ["E", "F", "B", "W"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B008", "B904", "B905"]
