{% extends "base.html" %}
{% block title %}CV editor{% endblock %}
{% block body_class %}app-page{% endblock %}
{% block body %}
<style>
  /* The editor fills the window under the header, like any other CVMaker page but full width. */
  body.app-page { overflow:hidden; }
  body.app-page .main-col { height:100vh; }
  body.app-page .page-main { flex:1; min-height:0; display:flex; }
  .editor-frame { flex:1; width:100%; border:0; display:block; background:var(--bg); }
</style>
<iframe class="editor-frame" src="/editor/app{{ query }}" title="CV editor"></iframe>
<script>
  // Keep the editor's theme in step with the header's toggle (the editor also follows the system setting).
  const frame = document.querySelector(".editor-frame");
  const sendTheme = () => frame.contentWindow?.postMessage({ theme: document.documentElement.dataset.theme || "" }, location.origin);
  new MutationObserver(sendTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  frame.addEventListener("load", sendTheme);
</script>
{% endblock %}
