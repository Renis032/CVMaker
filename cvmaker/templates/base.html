<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CVMaker{% endblock %}</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1d2733; --muted:#6b7785; --line:#dfe5ec; --brand:#1f3a5a; --accent:#1a8cff; --good:#1e8e5a; --warn:#b26a00; --bad:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:12px 24px; display:flex; gap:24px; align-items:center; }
  header a { color:#fff; text-decoration:none; opacity:.85; } header a:hover { opacity:1; }
  header .logo { font-weight:700; font-size:18px; opacity:1; }
  .wrap { max-width:1150px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  h1,h2,h3 { margin:0 0 10px; } h1 { font-size:22px; } h2 { font-size:18px; } h3 { font-size:15px; }
  label { display:block; font-weight:600; font-size:13px; margin:8px 0 3px; color:var(--muted); }
  input[type=text], input[type=number], textarea, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font:inherit; background:#fff; }
  textarea { min-height:70px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:4px 16px; }
  button, .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:7px; padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  button.secondary, .btn.secondary { background:#e8eef5; color:var(--brand); }
  button:disabled { opacity:.6; cursor:wait; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; color:var(--muted); }
  .pill { display:inline-block; font-size:12px; padding:1px 8px; border-radius:20px; background:#eef2f6; color:var(--muted); margin-right:4px; }
  .score { font-weight:700; } .s-bad { color:var(--bad); }
  table.fit td { padding:5px 6px; font-size:14px; } .advice { color:var(--brand); background:#eef5ff; border-radius:6px; padding:4px 8px; margin-top:4px; font-size:13px; } table.fit td.rating { font-weight:700; white-space:nowrap; width:52px; } .s-hi { color:var(--good); } .s-mid { color:var(--warn); } .s-lo { color:var(--muted); }
  .err { background:#fdecea; color:var(--bad); padding:10px 14px; border-radius:8px; margin-bottom:12px; }
  .tabs a { margin-right:14px; text-decoration:none; color:var(--muted); } .tabs a.on { color:var(--brand); font-weight:700; }
  .desc { white-space:pre-wrap; font-size:14px; max-height:520px; overflow:auto; background:#fafbfc; border:1px solid var(--line); border-radius:8px; padding:12px; }
  iframe.cv { width:100%; height:1150px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  ul.tight { margin:4px 0; padding-left:20px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:18px; } @media (max-width:800px){ .two { grid-template-columns:1fr; } }
  .busy { display:none; } form.working .busy { display:inline; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">CVMaker</a>
  <a href="/">Jobs</a>
  <a href="/?status=liked">Liked</a>
  <a href="/?status=applied">Applied</a>
  <a href="/roles">Role profiles</a>
  <a href="/profile">My profile{% if not profile_exists %} (set up!){% endif %}</a>
</header>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<script>
  document.querySelectorAll("form[data-slow]").forEach(f => f.addEventListener("submit", () => {
    f.classList.add("working");
    f.querySelectorAll("button").forEach(b => b.disabled = true);
  }));
</script>
</body>
</html>
